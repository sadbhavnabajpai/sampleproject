<!DOCTYPE html>
<html>
    <head>
        <title>Hex Colors</title>
        <style>
            h1 {
                color: #ff0000;
                text-align:center;
                text-decoration:underline;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            <!--p {
                color:#0000ff;
            }-->
            h2 {
                color: hsl(293, 100%, 50%);
                text-align:right;
                text-transform: uppercase;
                font-size: 30px; 
            }
                .greeting{
                border-width: 5px;
                color: hsl(150,60%,65%);
                border-style:solid;
                border-color:hotpink;
                border-radius: 10px;
            }
                .Question{
                text-transform: capitalize;
                font-style:italic;
                font-size:70px;
                border-style:double;
                border-color:rgb(20, 220, 213);
                border-width:15px ;
                }
                .card{
                    width: 300px;
                    padding: 20px;
                    background-color: beige;
                    border: 2px solid blueviolet;
                    border-radius: 10px;
                }


            
        </style>
    </head>
    <body>
        <h1>welcome HOMEEEE</h1>
       <p class="greeting">Yayyy lessgo</p>
        <h2>Hello chicoss</h2>
        <p class="Question">How do u do!</p>
        <div class="card">
        <h2>Thought OF THE DAY</h2>
        <p> you only live once.</p>   
    </div>
    </body>
</html>
